      - name: Fix Java version
        run: |
          if [ -f project/app/build.gradle.kts ]; then
            FILE="project/app/build.gradle.kts"
            cat << 'EOF' >> "$FILE"

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          kotlin {
              jvmToolchain(17)
          }
          EOF
          elif [ -f project/app/build.gradle ]; then
            FILE="project/app/build.gradle"
            cat << 'EOF' >> "$FILE"

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          kotlin {
              jvmToolchain(17)
          }
          EOF
          else
            echo "Could not find app build file! Folder contents:"
            find project -maxdepth 3
            exit 1
          fi
