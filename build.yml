

name: Build My Little Library APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: 
steps:
  - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Android project
        run: |
          unzip MyLittleLibraryAndroid.zip -d project

      - name: Build Android APK
        run: gradle -p project :app:assembleDebug

      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: MyLittleLibrary-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          
